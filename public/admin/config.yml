# Sveltia CMS configuration for Wild Atlas
# Docs: https://sveltiacms.app/en/docs
#
# LOCAL WORKFLOW: the GitHub backend is used without signing in. Open
# /admin/index.html in Chrome or Edge, click "Work with Local Repository", pick
# this project folder, and the CMS reads and writes the real files under src/.
# No OAuth worker is needed until you want to edit on the deployed site: that is
# Phase 3, where the same backend signs in with a GitHub token.
#
# DEPLOYED (Phase 3): auth_methods: [token] shows "Sign In with Token" at
# wildatlas.org/admin/. The token is a fine-grained PAT limited to this repo.
# Only if non-technical editors ever need to sign in is the OAuth worker
# (sveltia-cms-auth) required: deploy it, fill in base_url, and switch to
# auth_methods: [oauth, token].
#
# (The earlier `test-repo` backend was a browser-only virtual filesystem: it
# never reads the repo, so it always started empty.)

backend:
  name: github
  repo: atp800/wildatlas
  branch: main
  auth_methods: [token]
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

# Drafts as pull requests need the GitHub backend. Enable this together with the
# `github` block above, so each draft gets a Cloudflare Pages preview build.
# publish_mode: editorial_workflow

site_url: https://wildatlas.org
display_url: https://wildatlas.org

# Stops empty optional fields being written as `null`, which the content schema
# does not accept for the date fields.
output:
  omit_empty_optional_fields: true

# Sveltia requires a top-level media_folder even though every collection below
# declares its own. The top-level public_folder is intentionally omitted: Sveltia
# rejects a relative one, and the collections need relative
# ../../../assets/<section> paths for Astro's image() helper to resolve them.
media_folder: /src/assets

# One collection per section folder. Articles live at
# src/content/articles/<section>/<slug>.md, and the article URL comes from that
# path, so the folder is authoritative; the `section` field mirrors it.
collections:
  - name: nature
    label: Nature
    label_singular: Nature article
    folder: src/content/articles/nature
    media_folder: /src/assets/nature
    public_folder: ../../../assets/nature
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [published_at, title]
    fields: &article_fields_nature
      - { name: title, label: Title, widget: string }
      - { name: image, label: Hero image, widget: image }
      - { name: description, label: Description, widget: text }
      - name: section
        label: Section
        widget: select
        options: [nature, eco, travel]
        default: nature
        hint: Must match the folder this entry lives in. The folder decides the article URL.
      - { name: topic, label: Topic, widget: string, required: false }
      - { name: tags, label: Tags, widget: string, required: false, hint: 'Comma separated, no brackets.' }
      - { name: author, label: Author, widget: string, required: false, default: Andreas }
      - { name: views, label: Views (legacy), widget: number, required: false, hint: 'Unused counter. Kept so saving an article does not drop it.' }
      - { name: highlighted, label: Highlighted, widget: boolean, required: false, default: false }
      - name: status
        label: Status
        widget: select
        options: [live, draft]
        default: draft
      - { name: created_at, label: Created, widget: datetime, type: date }
      - { name: published_at, label: Published, widget: datetime, type: date, required: false, hint: 'Leave blank to keep the article out of section listings.' }
      - { name: updated_at, label: Updated, widget: datetime, type: date, required: false }
      - { name: deleted_at, label: Deleted at, widget: string, required: false, default: 'null', hint: 'Leave as the word null unless the article is being retired.' }
      - { name: body, label: Body, widget: markdown }

  - name: eco
    label: Eco
    label_singular: Eco article
    folder: src/content/articles/eco
    media_folder: /src/assets/eco
    public_folder: ../../../assets/eco
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [published_at, title]
    fields: &article_fields_eco
      - { name: title, label: Title, widget: string }
      - { name: image, label: Hero image, widget: image }
      - { name: description, label: Description, widget: text }
      - name: section
        label: Section
        widget: select
        options: [nature, eco, travel]
        default: eco
        hint: Must match the folder this entry lives in. The folder decides the article URL.
      - { name: topic, label: Topic, widget: string, required: false }
      - { name: tags, label: Tags, widget: string, required: false, hint: 'Comma separated, no brackets.' }
      - { name: author, label: Author, widget: string, required: false, default: Andreas }
      - { name: views, label: Views (legacy), widget: number, required: false, hint: 'Unused counter. Kept so saving an article does not drop it.' }
      - { name: highlighted, label: Highlighted, widget: boolean, required: false, default: false }
      - name: status
        label: Status
        widget: select
        options: [live, draft]
        default: draft
      - { name: created_at, label: Created, widget: datetime, type: date }
      - { name: published_at, label: Published, widget: datetime, type: date, required: false, hint: 'Leave blank to keep the article out of section listings.' }
      - { name: updated_at, label: Updated, widget: datetime, type: date, required: false }
      - { name: deleted_at, label: Deleted at, widget: string, required: false, default: 'null', hint: 'Leave as the word null unless the article is being retired.' }
      - { name: body, label: Body, widget: markdown }

  - name: travel
    label: Travel
    label_singular: Travel article
    folder: src/content/articles/travel
    media_folder: /src/assets/travel
    public_folder: ../../../assets/travel
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [published_at, title]
    fields: &article_fields_travel
      - { name: title, label: Title, widget: string }
      - { name: image, label: Hero image, widget: image }
      - { name: description, label: Description, widget: text }
      - name: section
        label: Section
        widget: select
        options: [nature, eco, travel]
        default: travel
        hint: Must match the folder this entry lives in. The folder decides the article URL.
      - { name: topic, label: Topic, widget: string, required: false }
      - { name: tags, label: Tags, widget: string, required: false, hint: 'Comma separated, no brackets.' }
      - { name: author, label: Author, widget: string, required: false, default: Andreas }
      - { name: views, label: Views (legacy), widget: number, required: false, hint: 'Unused counter. Kept so saving an article does not drop it.' }
      - { name: highlighted, label: Highlighted, widget: boolean, required: false, default: false }
      - name: status
        label: Status
        widget: select
        options: [live, draft]
        default: draft
      - { name: created_at, label: Created, widget: datetime, type: date }
      - { name: published_at, label: Published, widget: datetime, type: date, required: false, hint: 'Leave blank to keep the article out of section listings.' }
      - { name: updated_at, label: Updated, widget: datetime, type: date, required: false }
      - { name: deleted_at, label: Deleted at, widget: string, required: false, default: 'null', hint: 'Leave as the word null unless the article is being retired.' }
      - { name: body, label: Body, widget: markdown }
