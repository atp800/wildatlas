<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Manager | Wild Atlas</title>
  </head>
  <body>
    <!--
      Sveltia CMS admin app. This must stay a static file in public/ rather than
      an Astro page, otherwise the dev server reloads it on every file change and
      can interrupt a save.

      The script is vendored next to this file (@sveltia/cms 0.259.0, fetched
      from unpkg) so a CDN or npm outage cannot take the editor down, and so the
      exact code being served is visible in the repo. The trailing
      sourceMappingURL comment was stripped; the app does not need it.
      To update: download the new version over sveltia-cms.js, strip that
      comment, and bump the version noted here.
    -->
    <script src="./sveltia-cms.js"></script>
  </body>
</html>
